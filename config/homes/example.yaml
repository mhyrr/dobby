# Dobby's example house: one of everything, nothing real.
#
# Copy it, edit it, point Dobby at it:
#
#     cp config/homes/example.yaml config/homes/my-house.yaml
#     DOBBY_HOME_MANIFEST=config/homes/my-house.yaml mix phx.server
#
# In an install it is /opt/dobby/config/home.yaml, so it needs no path override.
# It and config/soul.md — what the house contains, and who is answering — are
# the two files a household owns. Credentials and operator settings still come
# from the service environment.
#
# Credentials are never written here. `env:NAME` names an environment variable
# and Dobby reads it at boot, which is what keeps this file safe to share.

house:
  # A short name for this house, and the name Dobby answers to about it.
  id: example
  name: The Example House

  # Everything Dobby says about clocks is said in this zone.
  timezone: America/New_York

  # Where Home Assistant is, and a long-lived access token for it. Make the
  # token in HA under your profile → Security → Long-lived access tokens, then
  # export it as DOBBY_HA_TOKEN.
  home_assistant:
    url: env:DOBBY_HA_URL
    token: env:DOBBY_HA_TOKEN

  # The networks devices sit on. Optional, and only useful as a label a device
  # can point at — Dobby reads reachability from Home Assistant, never from here.
  networks:
    - id: home_wifi
      name: Home Wi-Fi

  # One entry per device Dobby manages.
  #
  #   id        how Dobby refers to it, forever. Convention is type:place.
  #   type      one of the semantic device types shown below.
  #   name      what the household calls it, in the words they actually use.
  #   aliases   the other words they use for the same thing.
  #   bindings  which Home Assistant entity is which part of this device.
  #   hands_only optional; true lets language read but not command this device.
  #   settings  household policy, narrowing what the device already allows.
  #
  # The entity ids below are made up. Yours are in Home Assistant under
  # Settings → Devices & services → Entities.
  devices:
    # A thermostat Dobby can read and set. The temperature range the hardware
    # allows is discovered from the device itself; `settings` only narrows that
    # to what this household is willing to have asked for, and can never widen
    # it — so nobody, including Dobby, can set the house to 90.
    - id: thermostat:hall
      type: thermostat
      name: hall thermostat
      aliases: [the thermostat, downstairs thermostat]
      bindings:
        climate: climate.hall
      settings:
        min_temperature_f: 60
        max_temperature_f: 78

    # A light Dobby can switch, and dim if the bulb says it dims. Whether it
    # dims is the bulb's word (its supported colour modes), never a setting.
    - id: light:living_room
      type: light
      name: living room light
      aliases: [living room lamp]
      bindings:
        light: light.living_room

    # A speaker from any HA integration. Play, pause, and volume appear only
    # when the media player reports those capabilities.
    - id: speaker:kitchen
      type: speaker
      name: kitchen speaker
      aliases: []
      bindings:
        media_player: media_player.kitchen

    # A camera is read-only in Dobby. A related motion entity is optional.
    - id: camera:back_yard
      type: camera
      name: back yard camera
      aliases: []
      bindings:
        camera: camera.back_yard
        motion: binary_sensor.back_yard_motion

    # Home Assistant represents a doorbell ring as an event. Its camera and
    # motion sensor remain parts of the same household device.
    - id: doorbell:front
      type: doorbell
      name: front doorbell
      aliases: []
      bindings:
        event: event.front_door
        camera: camera.front_door
        motion: binary_sensor.front_door_motion

    # Secure-direction actions only. This lock is also hands only: language can
    # read it, while direct controls and admin schedules retain the secure action.
    - id: lock:front
      type: lock
      name: front door lock
      aliases: []
      hands_only: true
      bindings:
        lock: lock.front_door

    - id: cover:garage
      type: access_cover
      name: garage door
      aliases: []
      bindings:
        cover: cover.garage_door

    # Plugs, outlets, and relays use the switch domain. A light remains a
    # light when Home Assistant exposes it through the light domain.
    - id: switch:coffee
      type: power_switch
      name: coffee station
      aliases: []
      bindings:
        switch: switch.coffee_station

    # Non-access covers can move both ways. Position appears only when HA says
    # the hardware supports it.
    - id: shade:dining
      type: shade
      name: dining room shade
      aliases: []
      bindings:
        cover: cover.dining_shade

    - id: fan:bedroom
      type: fan
      name: bedroom fan
      aliases: []
      bindings:
        fan: fan.bedroom

    # Several readings from one HA device become one environment monitor.
    - id: monitor:office
      type: environment_monitor
      name: office air
      aliases: []
      bindings:
        temperature: sensor.office_temperature
        humidity: sensor.office_humidity

    - id: contact:patio
      type: contact_sensor
      name: patio door
      aliases: []
      bindings:
        contact: binary_sensor.patio_door

    - id: occupancy:hall
      type: occupancy_sensor
      name: hall occupancy
      aliases: []
      bindings:
        occupancy: binary_sensor.hall_occupancy

    # Life-safety sensors are read-only. Sirens and alarm panels are different
    # actors and are not exposed through this type.
    - id: safety:basement
      type: safety_sensor
      name: basement smoke detector
      aliases: []
      bindings:
        alarm: binary_sensor.basement_smoke

    # Appliance status uses explicit HA sensor bindings. These are examples;
    # replace them with the entities your integration actually exposes.
    # See docs/appliance-research.md for Bosch, Wolf, and Sub-Zero setup.
    - id: dishwasher:kitchen
      type: dishwasher
      name: kitchen dishwasher
      aliases: [the dishwasher]
      bindings:
        operation_state: sensor.dishwasher_operation_state
        door_open: sensor.dishwasher_door
        progress: sensor.dishwasher_program_progress

    - id: oven:kitchen
      type: oven
      name: kitchen oven
      aliases: [the oven]
      bindings:
        temperature: sensor.oven_temperature
        target_temperature: sensor.oven_setpoint

    # Some refrigerators report only targets. A target is never presented as
    # a measured temperature. Add display-temperature bindings only if HA
    # actually exposes those readings.
    - id: refrigerator:kitchen
      type: refrigerator
      name: kitchen refrigerator
      aliases: [the fridge]
      bindings:
        refrigerator_target_temperature: sensor.refrigerator_setpoint
        freezer_target_temperature: sensor.freezer_setpoint
        refrigerator_door_open: binary_sensor.refrigerator_door

    # A stacked washer and dryer have separate cycles and separate entries.
    # Keep only readings your HA integration exposes. No start/stop commands
    # are offered by these types yet.
    - id: washer:laundry
      type: washer
      name: laundry washer
      aliases: [the washer, washing machine]
      bindings:
        operation_state: sensor.washer_operation_state
        remaining_time: sensor.washer_remaining_time
        door_open: binary_sensor.washer_door

    - id: dryer:laundry
      type: dryer
      name: laundry dryer
      aliases: [the dryer]
      bindings:
        operation_state: sensor.dryer_operation_state
        remaining_time: sensor.dryer_remaining_time
        door_open: binary_sensor.dryer_door

    # Native HA interfaces support controls according to reported capabilities.
    - id: water_heater:utility
      type: water_heater
      name: water heater
      bindings:
        water_heater: water_heater.utility
      settings:
        # Must match HA's system unit when the entity omits its unit.
        temperature_unit: °F
        max_temperature_f: 120

    - id: humidifier:bedroom
      type: humidifier
      name: bedroom humidifier
      bindings:
        humidifier: humidifier.bedroom
      settings:
        max_humidity_percent: 55

    - id: dehumidifier:basement
      type: dehumidifier
      name: basement dehumidifier
      bindings:
        humidifier: humidifier.basement

    # HA fan entities need an explicit household role for these types.
    # A hood's light can be a separate normal light entry.
    - id: air_purifier:bedroom
      type: air_purifier
      name: bedroom air purifier
      bindings:
        fan: fan.bedroom_purifier
        filter_remaining: sensor.bedroom_filter_remaining

    - id: range_hood:kitchen
      type: range_hood
      name: kitchen range hood
      bindings:
        fan: fan.kitchen_hood
        filter_due: binary_sensor.kitchen_hood_filter_due

    # These types report explicit sensor bindings; they expose no commands.
    - id: coffee_maker:kitchen
      type: coffee_maker
      name: kitchen coffee maker
      bindings:
        operation_state: sensor.coffee_maker_state
        water_empty: binary_sensor.coffee_maker_water_empty

    - id: wine_cooler:dining
      type: wine_cooler
      name: dining room wine cooler
      bindings:
        temperature: sensor.wine_cooler_temperature
        target_temperature: number.wine_cooler_target

    - id: ice_maker:kitchen
      type: ice_maker
      name: kitchen ice maker
      bindings:
        ice_full: binary_sensor.ice_maker_full

    # Use a separate cooktop entry for each zone when HA exposes zones.
    - id: cooktop:kitchen_front
      type: cooktop
      name: front cooktop zone
      bindings:
        active: binary_sensor.cooktop_front_active
        hot_surface: binary_sensor.cooktop_front_hot

    - id: microwave:kitchen
      type: microwave
      name: kitchen microwave
      bindings:
        operation_state: sensor.microwave_state
        remaining_time: sensor.microwave_remaining_time

    # A robot vacuum Dobby can start and send home.
    - id: vacuum:downstairs
      type: vacuum
      name: robot vacuum
      aliases: [the vacuum]
      bindings:
        vacuum: vacuum.downstairs

    # Something on the network Dobby can tell you the reachability of, and only
    # that: a printer, a television, a speaker. Read-only on purpose. The usual
    # source is Home Assistant's ping integration, which is what `ha_integration`
    # records — a note for whoever reads this file, not a switch.
    - id: wifi:office_printer
      type: wifi_endpoint
      name: office printer
      aliases: [the printer]
      network: home_wifi
      ha_integration: ping
      bindings:
        connectivity: binary_sensor.office_printer

  # Standing rules: conditions Dobby watches and reports on, never acts on.
  # Dobby writes these from the thread once the household agrees, and The
  # House page writes them from a form; this is the shape either way. Rules
  # only report. The guide's house page explains each field.
  #
  # rules:
  #   - id: cold-room
  #     name: Cold room
  #     device: thermostat:hall
  #     kind: state                    # state: holds for the duration; absence: no recorded change into it
  #     attribute: current_temperature_f
  #     operator: lt                   # eq, ne, and for numbers gt, gte, lt, lte
  #     value: 60
  #     duration_seconds: 1200
  #     enabled: true
  #     window:                        # optional: watch only inside a daily window
  #       start: "22:00"
  #       end: "06:00"                 # earlier than start means overnight
  #       days: [1, 2, 3, 4, 5]        # Monday is 1

# The box Dobby runs on, rather than the house it looks after. Everything here
# is optional. DOBBY_MODEL, PORT and DOBBY_LAN override their matching fields
# while exported, so a one-off experiment does not mean editing this file.
system:
  # Which model answers, as `openrouter:author/model`. Unset means the
  # committed default, GPT-5.6 Luna — the model Dobby is built and tested
  # against first — so a house that says nothing follows the default when it
  # moves. Name it to pin it:
  # model: openrouter:openai/gpt-5.6-luna
  #
  # The other model that has been walked. GLM 5.3 Flash gets its first word
  # out in well under a second and costs about the same per reply, and it is
  # only that fast with the two lines under it, so the three go together.
  # model: openrouter:z-ai/glm-5.3-flash
  # reasoning: low       # how hard the model thinks first: low, medium or high
  # routing: latency     # what OpenRouter optimizes for: latency, throughput or price
  #
  # Or name the one endpoint that serves the model and forbid a fallback, as
  # a slug from OpenRouter's endpoint listing. Routing lets OpenRouter choose
  # an endpoint per reply; a pin is the same endpoint every time, which is the
  # only way a measurement can be repeated. The endpoints measured fastest to
  # the first word are recorded in the house guide.
  # provider: together

  # The port the surface is served on.
  port: 4000

  # Answer to the whole household rather than to this machine only: bind every
  # interface and advertise the name below, so anyone at home can open
  # http://dobby.local:4000/. Both of these take effect when Dobby restarts.
  lan: false
  hostname: dobby.local
