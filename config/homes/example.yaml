# Dobby's example house: one of everything, nothing real.
#
# Copy it, edit it, point Dobby at it:
#
#     cp config/homes/example.yaml config/homes/my-house.yaml
#     DOBBY_HOME_MANIFEST=config/homes/my-house.yaml mix phx.server
#
# In an install it is /opt/dobby/config/home.yaml, so it needs no path override.
# It and config/soul.md — what the house contains, and who is answering — are
# the two files a household owns. Credentials and operator settings still come
# from the service environment.
#
# Credentials are never written here. `env:NAME` names an environment variable
# and Dobby reads it at boot, which is what keeps this file safe to share.

house:
  # A short name for this house, and the name Dobby answers to about it.
  id: example
  name: The Example House

  # Everything Dobby says about clocks is said in this zone.
  timezone: America/New_York

  # Where Home Assistant is, and a long-lived access token for it. Make the
  # token in HA under your profile → Security → Long-lived access tokens, then
  # export it as DOBBY_HA_TOKEN.
  home_assistant:
    url: env:DOBBY_HA_URL
    token: env:DOBBY_HA_TOKEN

  # The networks devices sit on. Optional, and only useful as a label a device
  # can point at — Dobby reads reachability from Home Assistant, never from here.
  networks:
    - id: home_wifi
      name: Home Wi-Fi

  # One entry per device Dobby manages.
  #
  #   id        how Dobby refers to it, forever. Convention is type:place.
  #   type      one of the semantic device types shown below.
  #   name      what the household calls it, in the words they actually use.
  #   aliases   the other words they use for the same thing.
  #   bindings  which Home Assistant entity is which part of this device.
  #   settings  household policy, narrowing what the device already allows.
  #
  # The entity ids below are made up. Yours are in Home Assistant under
  # Settings → Devices & services → Entities.
  devices:
    # A thermostat Dobby can read and set. The temperature range the hardware
    # allows is discovered from the device itself; `settings` only narrows that
    # to what this household is willing to have asked for, and can never widen
    # it — so nobody, including Dobby, can set the house to 90.
    - id: thermostat:hall
      type: thermostat
      name: hall thermostat
      aliases: [the thermostat, downstairs thermostat]
      bindings:
        climate: climate.hall
      settings:
        min_temperature_f: 60
        max_temperature_f: 78

    # A light Dobby can switch, and dim if the bulb says it dims. Whether it
    # dims is the bulb's word (its supported colour modes), never a setting.
    - id: light:living_room
      type: light
      name: living room light
      aliases: [living room lamp]
      bindings:
        light: light.living_room

    # A speaker from any HA integration. Play, pause, and volume appear only
    # when the media player reports those capabilities.
    - id: speaker:kitchen
      type: speaker
      name: kitchen speaker
      aliases: []
      bindings:
        media_player: media_player.kitchen

    # A camera is read-only in Dobby. A related motion entity is optional.
    - id: camera:back_yard
      type: camera
      name: back yard camera
      aliases: []
      bindings:
        camera: camera.back_yard
        motion: binary_sensor.back_yard_motion

    # Home Assistant represents a doorbell ring as an event. Its camera and
    # motion sensor remain parts of the same household device.
    - id: doorbell:front
      type: doorbell
      name: front doorbell
      aliases: []
      bindings:
        event: event.front_door
        camera: camera.front_door
        motion: binary_sensor.front_door_motion

    # Secure-direction actions only. Dobby can lock and close. It never offers
    # conversational unlock or open for access devices.
    - id: lock:front
      type: lock
      name: front door lock
      aliases: []
      bindings:
        lock: lock.front_door

    - id: cover:garage
      type: access_cover
      name: garage door
      aliases: []
      bindings:
        cover: cover.garage_door

    # Plugs, outlets, and relays use the switch domain. A light remains a
    # light when Home Assistant exposes it through the light domain.
    - id: switch:coffee
      type: power_switch
      name: coffee station
      aliases: []
      bindings:
        switch: switch.coffee_station

    # Non-access covers can move both ways. Position appears only when HA says
    # the hardware supports it.
    - id: shade:dining
      type: shade
      name: dining room shade
      aliases: []
      bindings:
        cover: cover.dining_shade

    - id: fan:bedroom
      type: fan
      name: bedroom fan
      aliases: []
      bindings:
        fan: fan.bedroom

    # Several readings from one HA device become one environment monitor.
    - id: monitor:office
      type: environment_monitor
      name: office air
      aliases: []
      bindings:
        temperature: sensor.office_temperature
        humidity: sensor.office_humidity

    - id: contact:patio
      type: contact_sensor
      name: patio door
      aliases: []
      bindings:
        contact: binary_sensor.patio_door

    - id: occupancy:hall
      type: occupancy_sensor
      name: hall occupancy
      aliases: []
      bindings:
        occupancy: binary_sensor.hall_occupancy

    # Life-safety sensors are read-only. Sirens and alarm panels are different
    # actors and are not exposed through this type.
    - id: safety:basement
      type: safety_sensor
      name: basement smoke detector
      aliases: []
      bindings:
        alarm: binary_sensor.basement_smoke

    # A robot vacuum Dobby can start and send home.
    - id: vacuum:downstairs
      type: vacuum
      name: robot vacuum
      aliases: [the vacuum]
      bindings:
        vacuum: vacuum.downstairs

    # Something on the network Dobby can tell you the reachability of, and only
    # that: a printer, a television, a speaker. Read-only on purpose. The usual
    # source is Home Assistant's ping integration, which is what `ha_integration`
    # records — a note for whoever reads this file, not a switch.
    - id: wifi:office_printer
      type: wifi_endpoint
      name: office printer
      aliases: [the printer]
      network: home_wifi
      ha_integration: ping
      bindings:
        connectivity: binary_sensor.office_printer

# The box Dobby runs on, rather than the house it looks after. Everything here
# is optional. DOBBY_MODEL, PORT and DOBBY_LAN override their matching fields
# while exported, so a one-off experiment does not mean editing this file.
system:
  # Which model answers, as `openrouter:author/model`. Unset means the
  # committed default, GPT-5.6 Luna — the model Dobby is built and tested
  # against first — so a house that says nothing follows the default when it
  # moves. Name it to pin it:
  # model: openrouter:openai/gpt-5.6-luna
  #
  # The other model that has been walked. GLM 5.3 Flash gets its first word
  # out in well under a second and costs about the same per reply, and it is
  # only that fast with the two lines under it, so the three go together.
  # model: openrouter:z-ai/glm-5.3-flash
  # reasoning: low       # how hard the model thinks first: low, medium or high
  # routing: latency     # what OpenRouter optimizes for: latency, throughput or price

  # The port the surface is served on.
  port: 4000

  # Answer to the whole household rather than to this machine only: bind every
  # interface and advertise the name below, so anyone at home can open
  # http://dobby.local:4000/. Both of these take effect when Dobby restarts.
  lan: false
  hostname: dobby.local
