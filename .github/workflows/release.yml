# The release, built where the box is not: one tag, two tarballs.
#
#     bin/changelog -r 0.2.0            # after setting the version in mix.exs
#     git commit -m "Dobby 0.2.0"
#     git tag v0.2.0 && git push origin main v0.2.0
#
# Each tarball is assembled by rel/Dockerfile on Debian 12, on a runner of the
# same architecture, so nothing is emulated. The tag must name the version in
# mix.exs. The release notes are CHANGELOG/<version>.md, the entry the
# changelog script cut, with GitHub's list of pull requests beneath; a tag
# with no entry gets the list alone. A pull request that touches the build
# definition runs the build and publishes nothing.

name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - rel/**
      - .github/workflows/release.yml
      - mix.exs
      - mix.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag names the version in mix.exs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' mix.exs)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but mix.exs says $version"
            exit 1
          fi

      - name: Build the tarball
        run: docker build -f rel/Dockerfile --output dist .

      - uses: actions/upload-artifact@v7
        with:
          name: dobby-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="CHANGELOG/${GITHUB_REF_NAME#v}.md"
          set -- --generate-notes
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes" "$@"
          else
            echo "no $notes; the release gets GitHub's generated notes alone"
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Dobby $GITHUB_REF_NAME" "$@" \
            dist/*.tar.gz
