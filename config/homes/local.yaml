# The local home (docs/developing.html, the guide's Developing chapter): a real
# Home Assistant in a container on this machine, demo entities, and — since 2026-08-17 — one real furnace. The
# same application as the rig, bound to the real client at the one honest
# boundary, which makes this file the first description of a house that exists
# outside the BEAM.
#
#     DOBBY_HOME_MANIFEST=config/homes/local.yaml \
#     DOBBY_HA_URL=http://localhost:8123 \
#     DOBBY_HA_TOKEN=<token> \
#     mix phx.server
#
# Both values come from the environment because this file is committed and
# tokens never are. `dev/home-assistant/onboard.exs` mints one. In development
# .env is read for you — see .env.example.

house:
  id: local
  name: Local Home
  timezone: America/New_York

  home_assistant:
    url: env:DOBBY_HA_URL
    token: env:DOBBY_HA_TOKEN

  devices:
    # The demo integration's full-featured thermostat. Its hardware envelope
    # (45–95°F on this instance) comes from capability discovery; settings
    # narrow it to household policy, exactly as in the rig.
    # First on purpose: `mix dobby.ha.verify --round-trip` nudges the first
    # thermostat it finds, and the default nudge should land on the virtual
    # one, never the furnace.
    - id: thermostat:main
      type: thermostat
      name: demo thermostat
      bindings:
        climate: climate.hvac
      settings:
        min_temperature_f: 60
        max_temperature_f: 76

    # The real Honeywell, through its RedLINK gateway and the TCC cloud — the
    # first entry in any home file describing hardware that exists. Cloud-polled,
    # so a change made at the physical dial waits for the poll; a change Dobby
    # commands confirms in about 400ms, because HA's honeywell integration
    # refreshes state right after a service call.
    - id: thermostat:house
      type: thermostat
      name: house thermostat
      aliases: [the thermostat, downstairs thermostat]
      bindings:
        climate: climate.thermostat
      settings:
        min_temperature_f: 60
        max_temperature_f: 78

    # A demo light that dims — whether Dobby may be asked for brightness is
    # discovered from its supported_color_modes, not assumed here.
    - id: light:living_room
      type: light
      name: living room light
      aliases: [living room lamp]
      bindings:
        light: light.living_room_rgbww_lights

    # The Roomba, once HA holds its credentials — the one step that needs a
    # human at the robot (docs/developing.html, "The Roomba"). Fill in the vacuum.*
    # entity id HA creates, then uncomment:
    #
    # - id: vacuum:roomba
    #   type: vacuum
    #   name: robot vacuum
    #   aliases: [the vacuum, the roomba]
    #   bindings:
    #     vacuum: vacuum.roomba

    # The actual printer, presence by ICMP: HA's ping integration pings
    # 192.168.86.218 and Dobby reads the resulting binary_sensor. If its DHCP
    # lease ever moves, fix the address in HA's ping entry — a reservation in
    # the router is the durable answer.
    - id: wifi:office_printer
      type: wifi_endpoint
      name: office printer
      aliases: [the printer]
      ha_integration: ping
      bindings:
        connectivity: binary_sensor.office_printer

# The box: this instance answers with GLM 5.3 Flash (TK-034). Flash is only
# fast with low reasoning and latency routing, so the three lines go together.
system:
  model: openrouter:z-ai/glm-5.3-flash
  reasoning: low
  routing: latency
